version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=pswrd
      - DB_NAME=glass
      - DB_PORT=5432
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - ./server:/app

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pswrd
      - POSTGRES_DB=glass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"
    depends_on:
      - server
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
