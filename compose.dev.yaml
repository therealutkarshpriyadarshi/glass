version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=pswrd
      - DB_NAME=glass
      - DB_PORT=5432
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - ./server:/app

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pswrd
      - POSTGRES_DB=glass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./client:/app
      - /app/node_modules

  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    depends_on:
      - server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=True
    volumes:
      - ./llm:/app
    command: uvicorn llm.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
